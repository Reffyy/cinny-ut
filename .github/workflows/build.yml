name: Build Clickable App

on:
  push:
  workflow_dispatch:

jobs:
  build:
    # Define environment variables instead of using a single-value matrix
    env:
      APP_NAME: cinny.danfro

    strategy:
      matrix:
        # The matrix is now only used for variables that change, like architecture
        arch: [arm64]

    # Corrected indentation for 'runs-on'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      # Extract versions needed for the setup-node action
      - name: Extract Node version from prebuild.sh
        id: node_version
        run: |
          echo "NODE_VERSION=$(grep -oP '(?<=NODE_VERSION=)[^ ]+' prebuild.sh)" >> $GITHUB_OUTPUT

      # Use the official action to set up the Node.js environment correctly
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node_version.outputs.NODE_VERSION }}

      # A simpler, more robust way to parse the version variables
      - name: Parse artifact version
        run: |
          source ./prebuild.sh
          echo "ARTIFACT_VERSION=${REPO_VERSION}${CLICK_VERSION_PREFIX}" >> $GITHUB_ENV

      - name: Install Clickable and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y adb git python3 python3-pip python3-setuptools
          python3 -m pip install --user clickable-ut
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build Clickable package
        run: |
          clickable build --arch ${{ matrix.arch }}

      - name: Upload .click artifact
        uses: actions/upload-artifact@v4
        with:
          # Use the environment variable for the artifact name
          name: ${{ env.APP_NAME }}_${{ matrix.arch }}_${{ env.ARTIFACT_VERSION }}
          # The clickable build command places the file in the project root by default
          path: ./*.click
          if-no-files-found: error
