name: Build only

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        arch: [arm64]
        appname: [cinny.danfro]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Extract NVM version from prebuild.sh
        id: extract-nvm-version
        run: |
          echo "NVM_VERSION=$(grep -oP '(?<=NVM_VERSION=)[^ ]+' prebuild.sh)" >> $GITHUB_ENV

      - name: Extract Node version from prebuild.sh
        id: extract-node-version
        run: |
          echo "NODE_VERSION=$(grep -oP '(?<=NODE_VERSION=)[^ ]+' prebuild.sh)" >> $GITHUB_ENV

      - name: Parse version
        run: |
          REPO_VERSION=$(grep 'export REPO_VERSION=' prebuild.sh | cut -d'"' -f2)
          CLICK_PREFIX=$(grep 'export CLICK_VERSION_PREFIX=' prebuild.sh | cut -d'"' -f2)
          echo "ARTIFACT_VERSION=${REPO_VERSION}${CLICK_PREFIX}" >> $GITHUB_ENV

      - name: Install Clickable dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y adb git python3 python3-pip python3-setuptools
          python3 -m pip install --user clickable-ut
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Mark repository as safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up Node.js and Build
        run: |
          # Set up the Node.js environment on the runner
          export NVM_DIR="$HOME/.nvm"
          curl -o- "https://raw.githubusercontent.com/nvm-sh/nvm/v${{ env.NVM_VERSION }}/install.sh" | bash
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm install "${{ env.NODE_VERSION }}"
          nvm use "${{ env.NODE_VERSION }}"
          echo "Using $(node -v) and $(npm -v)"
          
          # FIX: Run clickable with sudo to resolve user ID mapping errors.
          # The -E flag preserves the existing environment variables (like PATH and NVM_DIR).
          sudo -E clickable build --arch ${{ matrix.arch }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.appname }}_${{ env.ARTIFACT_VERSION }}_${{ matrix.arch }}
          path: build/*/app/*.click
          if-no-files-found: error

