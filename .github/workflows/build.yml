name: Build Clickable App

on:
  push:
  workflow_dispatch:

jobs:
  build:
    env:
      APP_NAME: cinny.danfro

    strategy:
      matrix:
        arch: [arm64]

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      # Step 1: Set up the correct Node.js version on the runner
      - name: Extract Node version
        id: node_version
        run: echo "NODE_VERSION=$(grep -oP '(?<=NODE_VERSION=)[^ ]+' prebuild.sh)" >> $GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node_version.outputs.NODE_VERSION }}
          cache: 'npm' # Speeds up future builds by caching dependencies

      # Step 2: Run the actual build commands (e.g., npm install/build)
      - name: Build web application
        run: |
          # These commands must match what your prebuild.sh script does.
          # This is just an example.
          npm install
          npm run build

      # Step 3: Install Clickable
      - name: Install Clickable and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y adb git python3 python3-pip python3-setuptools
          python3 -m pip install --user clickable-ut
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # Step 4: Package the pre-built application using Clickable
      # Clickable will now find the already-built files and package them.
      - name: Package with Clickable
        run: |
          clickable build --arch ${{ matrix.arch }}

      # Step 5: Upload the final .click file
      - name: Upload .click artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}_${{ matrix.arch }}
          path: ./*.click
          if-no-files-found: error
