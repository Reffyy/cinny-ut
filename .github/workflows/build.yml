name: Build only

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        arch: [arm64]
        appname: [cinny.danfro]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Extract NVM version from prebuild.sh
        id: extract-nvm-version
        run: |
          echo "NVM_VERSION=$(grep -oP '(?<=NVM_VERSION=)[^ ]+' prebuild.sh)" >> $GITHUB_ENV

      - name: Extract Node version from prebuild.sh
        id: extract-node-version
        run: |
          echo "NODE_VERSION=$(grep -oP '(?<=NODE_VERSION=)[^ ]+' prebuild.sh)" >> $GITHUB_ENV

      - name: Set up Node.js environment
        run: |
          export NVM_DIR="$HOME/.nvm"
          curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v$NVM_VERSION/install.sh | bash
          . "$NVM_DIR/nvm.sh"
          nvm install $NODE_VERSION
          nvm use $NODE_VERSION
          echo "Node.js $(node -v) installed via nvm"

      - name: Parse version
        run: |
          echo ARTIFACT_VERSION=$(cat prebuild.sh | grep "export REPO_VERSION=" | awk -F'"' '$0=$2')$(cat prebuild.sh | grep "export CLICK_VERSION_PREFIX=" | awk -F'"' '$0=$2') >> $GITHUB_ENV

      - name: Install Clickable dependencies
        run: |
          sudo apt update
          sudo apt install -y adb git python3 python3-pip python3-setuptools
          python3 -m pip install --user clickable-ut
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build inside container
        run: |
          clickable build --arch ${{ matrix.arch }} --container

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.appname }}_${{ matrix.arch }}
          path: build/*/app/*.click
          if-no-files-found: error
